<div class="container">

  <h2>Kursy walut</h2>

  <div class="controls">
    <input type="number" [(ngModel)]="year" placeholder="rok">
    <input type="number" [(ngModel)]="month" placeholder="miesiąc">
    <input type="number" [(ngModel)]="day" placeholder="dzień">

    <button (click)="load()">Filtruj</button>
    <button (click)="fetch()">Pobierz z NBP</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kod</th>
        <th>Nazwa</th>
        <th>Kurs</th>
        <th>Data</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of data">
        <td>{{item[0]}}</td>
        <td>{{item[1]}}</td>
        <td>{{item[2]}}</td>
        <td>{{item[3]}}</td>
      </tr>
    </tbody>
  </table>

</div>
